[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-rank-audit"
version = "0.1.0"
description = "Manifest-gated policy ranking for repeated finite-configuration censuses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
policy-rank-audit = "policy_rank_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
